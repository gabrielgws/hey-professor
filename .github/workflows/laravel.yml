name: CI

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          # Adicionadas extensões essenciais para evitar erros de plataforma
          extensions: mbstring, bcmath, pdo_sqlite, tokenizer, xml, ctype, json, dom, curl, libxml
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps:composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        # O comando --ignore-platform-reqs resolve o erro de incompatibilidade do lock file
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          # Garante permissão nos diretórios necessários e nos binários
          chmod -R 775 storage bootstrap/cache
          chmod +x vendor/bin/phpstan
          chmod +x vendor/bin/pint

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test --parallel

      - name: Run Larastan (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test
